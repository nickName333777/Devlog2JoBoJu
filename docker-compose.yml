services: 

  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle21c  # 기존 컨테이너 이름 사용
    environment:
      - ORACLE_PWD=YourSecurePassword123 #  .env 참조
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - /home/oracle/oradata:/opt/oracle/oradata  # 기존 호스트 경로 사용  (로컬에 /home/oracle/oradata 존재해야함)
      - ./init_scripts:/opt/oracle/scripts/setup # DB 최초 생성 시 1회만 실행(cf: startup)
    networks:
      - jbj-network
    healthcheck:
      test: >
        CMD-SHELL
        echo "SELECT 1 FROM dual;" |
        sqlplus -s sys/YourSecurePassword123@//localhost:1521/XEPDB1 as sysdba

      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s


  fastapi-backend: # 서비스(컨테이너) 논리적 이름. 
    build: # image build
      context: .
      dockerfile: Dockerfile
    container_name: jbj-fastapi
    environment:
      - DB_USER=your_userId # for Oracle DB
      - DB_PASSWORD=your_userId_password 
      - DB_HOST=oracle21c  # 기존 컨테이너 이름
      - DB_PORT=1521
      - DB_SERVICE=XEPDB1
      - SMTP_SERVER=smtp.gmail.com # for EmailAuth .env로부터 
      - SMTP_PORT=587
      - SMTP_USER=your@gmail.com
      - SMTP_PASSWORD=your_app_password
      - KAKAO_REST_API_KEY=your_key # for 카카오 소셜로그인,  .env로부터 
      - KAKAO_CLIENT_SECRET=your_client_secret
      - KAKAO_REDIRECT_URI=your_callback_uri
      
    ports:
      - "8880:8880"
    volumes:
      - .:/app
      - ./static:/app/static # 
      - ./templates:/app/templates  # 
      - ./uploads:/mnt/user-data/uploads  # 업로드 파일 저장 
    env_file:
      - .env           
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - jbj-network # 원하는 이름으로 네트웍 이름 변경
    extra_hosts: #extra_hosts 는 컨테이너안에 /etc/hosts 에 수동으로 엔트리를 추가
      - "oracle21c:host-gateway"  
    restart: unless-stopped # 명시적으로 docker compose stop 등으로 멈추지 않는 한 계속 살아있도록


  # Elasticsearch(image-name: docker.elastic.co/elasticsearch/elasticsearch:8.11.0,  container-name: jbj-elasticsearch) 
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: jbj-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - /home/elasticsearch/esdata:/usr/share/elasticsearch/data  # host 폴더에 마운트 (로컬에 /home/elasticsearch/esdata 존재해야함)
    networks:
      - jbj-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana(image-name: docker.elastic.co/kibana/kibana:8.11.0 ,  container-name: jbj-kibana) 
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: jbj-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - jbj-network
    restart: unless-stopped

  # Logstash (Optional - 추후 로그 수집용)(image-name: docker.elastic.co/logstash/logstash:8.11.0,  container-name: jbj-logstash) 
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: jbj-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config:/usr/share/logstash/config  #  # 디렉토리 → 디렉토리:  Docker 공식 Logstash 이미지는 config 디렉토리 전체를 마운트하도록 설계되어 있다.
    ports:
      - "5044:5044"
      - "9600:9600"
    depends_on:
      - elasticsearch
    networks:
      - jbj-network
    restart: unless-stopped

networks:
  jbj-network: # 네트웍이름 고정
    driver: bridge
