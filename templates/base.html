<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JBJ Community{% endblock %}</title>
    
    <!-- 공통 CSS -->
    <link rel="stylesheet" href="{{ url_for(request, 'static', path='/css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for(request, 'static', path='/css/fontawesome/all.min.css') }}">    
    <!-- all.min.css 내에서 WebFont 파일의 경로가 상대 경로("../webfonts/...woff2 또는 .ttf")로 되어 있으므로, ("/static/webfonts/...woff2 또는 .ttf"") 경로로 변경/명시해주면 로컬에서 아이콘들을 제대로 불러올 수 있다 -->
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
    
    <!-- 페이지별 CSS -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 헤더 -->
    {% include 'components/header.html' %}

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 푸터 -->
    {% include 'components/footer.html' %}


    <!-- 페이지별 JS: 스크립트 순서 변경 -->
    {% block extra_js %}{% endblock %}

    <!-- 공통 JS -->
    <script src="{{ url_for(request, 'static', path='/js/common.js') }}"></script>
    
    <!-- 페이지별 JS -->
    <!-- {  % block extra_js %  }{  % endblock %  } -->
</body>
</html>
